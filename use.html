<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>use() – iki1uc Operator</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
pre{background:#111;padding:10px;border:1px solid #333}
button{background:#111;border:1px solid #0f0;color:#0f0;padding:6px 12px;margin:6px;cursor:pointer}
button:hover{background:#0f0;color:#000}
</style>
</head>
<body>

<h2>use(user(lage(respo(argumenteria,myWIKI),formeln),fähigkeiten))</h2>
<button id="btn">use()</button>
<pre id="out">bereit.</pre>

<script type="module">
import { scan, orbit, operator, run, math, usability } from "./move.js";
import { USE_ID } from "./ID.html"; // falls ID.html als .js liegt: "./ID.js"

const MODULES = {
  LAGE: ["W","S","A","D","Q","R","Y","C","X"],
  RESPO: ["Struktur","Ordnung","Wirkung"],
  ARGUMENT: ["Klarheit","Integrität"],
  WIKI: "Formeln sichtbar (neutral)",
  TMP: "TMP-LAGE: aktiv",
  GHOST: "GHOST-SCAN: bereit",
  FINAL: "reFINAL: +1 System-Reingewinn"
};

document.getElementById("btn").onclick = () => {
  // use() = 1 Aufruf, alles aus move.js, nichts kopiert
  const probe = "Φ + AX + P4";
  const u = usability({ name: "iki", level: 1, status: "bereit" }, probe);
  document.getElementById("out").textContent =
    "use() aktiv — BESSER\n" +
    "──────────────────────────────\n" +
    "LAGE: " + MODULES.LAGE.join(" + ") + "\n" +
    "RESPO: " + MODULES.RESPO.join(" + ") + "\n" +
    "Argumenteria: " + MODULES.ARGUMENT.join(" + ") + "\n" +
    "myWIKI: " + MODULES.WIKI + "\n" +
    MODULES.TMP + "\n" + MODULES.GHOST + "\n" + MODULES.FINAL + "\n\n" +
    "SCAN: " + JSON.stringify(u.scan) + "\n" +
    "ORBIT: " + u.orbit + " | OP: " + u.operator + " | RUN: " + u.run + "\n" +
    "MATH: " + JSON.stringify(u.math) + "\n" +
    "USE_ID: " + JSON.stringify(USE_ID ?? "in ID.js");
};
</script>
</body>
</html>
